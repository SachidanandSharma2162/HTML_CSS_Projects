<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login-form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="nav">
        <div class="left">
            <h3>My<span>Logo</span></h3>
        </div>
        <div class="right">
            <h4>Home</h4>
            <h4>Daily</h4>
            <h4>Login</h4>
            <h4>Setup</h4>
        </div>
        </div>
        
        <div class="form-section">
            <div class="form">
                <h3 class="heading">Login</h3>
                <form action="">
                    <div class="user">
                        <label class="username" for="">Username</label>
                        <input class="userinput" type="text" placeholder="Enter username">
                    </div>
                    <div class="pass">
                        <label class="password" for="">Password</label>
                        <input class="passinput" type="password" placeholder="Enter password">
                    </div>
                    <p>Not a member! <span>Register!</span></p>
                    <button class="submit">Submit</button>
                </form>
            </div>
        </div>
        <div class="about-us">
            <div class="about-container">
                <div class="about-image">
                    <img src="https://plus.unsplash.com/premium_photo-1664116928414-2ab998603666?q=80&w=387&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Company Image" width="300">
                </div>
                <div class="about-text">
                    <h2>About Us</h2>
                    <p>
                        [Your company's brief description goes here. This is where you can highlight your company's mission, values, history, or any other important information you want to convey to your visitors. Be concise and engaging.]
                    </p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const button=document.querySelector('.submit')
        const username=document.querySelector(".userinput")
        button.addEventListener('click',(e)=>{
            e.preventDefault();
            alert(username.value)
        })
    </script>
</body>
</html>
